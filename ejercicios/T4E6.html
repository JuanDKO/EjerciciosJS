<!DOCTYPE html>
<html>

<body>

    <h2>Cronómetro</h2>
    <button onclick="iniciar()">Iniciar/Reanudar</button>
    <button onclick="parar()">Parar</button>
    <button onclick="borrar()">Borrar</button>

    <p id="demo">0</p>

    <script>
        let tiempo = localStorage.getItem("tiempo") || 0;
        console.log("Tiempo recargado: " + tiempo);
        document.getElementById("demo").innerHTML = tiempo;
        let intervalo;

        function iniciar() {
            clearInterval(intervalo);
            intervalo = setInterval(() => {
                tiempo++;
                console.log("Tiempo actual: " + tiempo);
                document.getElementById("demo").innerHTML = tiempo;
                localStorage.setItem("tiempo", tiempo);
            }, 1000);
        }

        function parar() {
            clearInterval(intervalo);
        }

        function borrar() {
            parar();
            tiempo = 0;
            console.log("Tiempo borrado: " + tiempo);
            document.getElementById("demo").innerHTML = tiempo;
            localStorage.removeItem("tiempo");
        }
    </script>
</body>

</html>
